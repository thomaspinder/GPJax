version: 2
updates:
  # Python dependencies. Uses the `uv` ecosystem, not `pip`, so that Dependabot
  # reads the PEP 735 `[dependency-groups]` dev group and keeps `uv.lock` in
  # step with `pyproject.toml`. The `pip` ecosystem does neither.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    assignees:
      - "thomaspinder"
    commit-message:
      prefix: "deps"
      prefix-development: "dev-deps"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Catch-all groups: one PR per run for version updates, one for security
    # updates. Without a `*` pattern, unmatched dependencies get their own PR.
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Ignore major version updates for stable dependencies
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]

  # GitHub Actions. Groups cannot span `updates` entries, so this is always a
  # separate PR from the Python one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    # `github_actions` (underscore) is the label that exists in the repo;
    # `github-actions` from labels.yml has never been synced and is ignored.
    labels:
      - "github_actions"
      - "automated"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
