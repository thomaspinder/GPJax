name: Build the documentation

# Production docs build. Ported from impulso's `build-docs` + `deploy-docs`
# jobs (../impulso/.github/workflows/main.yml).
#
# Deliberately NOT triggered by tags: a tag used to fire the same publish job as
# `main`, so tagging a release overwrote the main-branch docs with a snapshot and
# the next merge overwrote it back.
#
# The pull-request half of impulso's conditional lives in test_docs.yml, which is
# where GPJax already runs its PR docs build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages publication is confined to `deploy-docs`; the build job only reads the
# repository. Keeping `pages`/`id-token` off the workflow level means the
# notebook execution step never runs with a deployment-capable token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs (full render)
    # Full render on main executes every example notebook for real.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, including the asv-results branch
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore notebook execution cache
        # Unique key per run so the cache is ALWAYS re-saved (actions/cache
        # refuses to overwrite an existing key). Combined with jupyter-cache's
        # own content-hash invalidation, this makes the cache accumulate every
        # successfully executed notebook instead of freezing partial progress.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/_build/.jupyter_cache
            docs/_build/.jupyter_cache_ci
          key: jupyter-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jupyter-cache-

      - name: Build documentation (full-fidelity render, resilient)
        # `-W` IS used here, unlike before. GPJAX_DOCS_RESILIENT=1 makes conf.py
        # suppress exactly the two notebook-execution warning subtypes, so a
        # slow or broken notebook still renders an error cell and the site still
        # deploys — but a broken xref, bad anchor or malformed directive now
        # fails the deploy instead of shipping silently, which is what this
        # build did when it ran with no `-W` at all.
        env:
          GPJAX_DOCS_RESILIENT: "1"
        run: uv run --extra docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload notebook execution tracebacks
        # `nb_execution_raise_on_error` is off, so MyST-NB writes the full
        # traceback of any failed notebook to <outdir>/reports/<docname>.err.log
        # rather than aborting. Nothing else in the deploy log carries it.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notebook-error-logs
          path: docs/_build/html/reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Checkout benchmark results
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: asv-results
          path: .asv-results
          persist-credentials: false
        continue-on-error: true

      - name: Render benchmark dashboard
        run: |
          uv run asv publish || true
          if [ -d ".asv/html" ]; then
            mkdir -p docs/_build/html/benchmarks
            cp -r .asv/html/* docs/_build/html/benchmarks/
          else
            echo "No benchmark HTML produced — skipping"
          fi
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy-docs:
    needs: build-docs
    # impulso guards this job with `github.event_name == 'push' && github.ref ==
    # 'refs/heads/main'`. GPJax also allows workflow_dispatch, so the branch
    # check is kept but the event check is not: a manual run from a feature
    # branch must never publish to the production URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC verification of the deployment
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
