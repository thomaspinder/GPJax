name: Build the documentation

on:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    timeout-minutes: 30
    concurrency: ci-${{ github.ref }}
    name: Build docs (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11"]

    steps:
      # Grap the latest commit from the branch
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Create a virtual environment
      - name: create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}

      # Install katex for math support
      - name: Install NPM
        uses: actions/setup-node@v6
        with:
          node-version: 16
      - name: Install KaTeX
        run: |
          npm install katex

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Build the documentation with MKDocs
        run: |
          conda install pandoc
          uv sync --frozen --extra docs
          uv run python docs/scripts/gen_examples.py --execute --parallel --max_workers 4
          uv run mkdocs build

      - name: Checkout benchmark results
        uses: actions/checkout@v7
        with:
          ref: asv-results
          path: .asv-results
          persist-credentials: false
        continue-on-error: true

      - name: Render benchmark dashboard
        run: |
          uv run asv publish || true
          if [ -d ".asv/html" ]; then
            mkdir -p site/benchmarks
            cp -r .asv/html/* site/benchmarks/
          else
            echo "No benchmark HTML produced — skipping"
          fi
        continue-on-error: true

      - name: Deploy Page 🚀
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: site
