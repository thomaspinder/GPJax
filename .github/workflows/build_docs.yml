name: Build the documentation

# Production docs build. Ported from impulso's `build-docs` + `deploy-docs`
# jobs (../impulso/.github/workflows/main.yml).
#
# Deliberately NOT triggered by tags: a tag used to fire the same publish job as
# `main`, so tagging a release overwrote the main-branch docs with a snapshot and
# the next merge overwrote it back.
#
# The pull-request half of impulso's conditional lives in test_docs.yml, which is
# where GPJax already runs its PR docs build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs (full render)
    # Full render on main executes every example notebook for real.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore notebook execution cache
        # Unique key per run so the cache is ALWAYS re-saved (actions/cache
        # refuses to overwrite an existing key). Combined with jupyter-cache's
        # own content-hash invalidation, this makes the cache accumulate every
        # successfully executed notebook instead of freezing partial progress.
        uses: actions/cache@v6
        with:
          path: |
            docs/_build/.jupyter_cache
            docs/_build/.jupyter_cache_ci
          key: jupyter-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jupyter-cache-

      - name: Build documentation (full-fidelity render, resilient)
        # Not -W here: the deploy must not be blocked by a warning or a single
        # slow/failed notebook. Cached notebooks render real figures; anything
        # that fails execution renders an error cell but the site still deploys.
        # The PR build in test_docs.yml stays strict.
        env:
          GPJAX_DOCS_RESILIENT: "1"
        run: uv run --extra docs sphinx-build --keep-going -b html docs docs/_build/html

      - name: Checkout benchmark results
        uses: actions/checkout@v7
        with:
          ref: asv-results
          path: .asv-results
          persist-credentials: false
        continue-on-error: true

      - name: Render benchmark dashboard
        run: |
          uv run asv publish || true
          if [ -d ".asv/html" ]; then
            mkdir -p docs/_build/html/benchmarks
            cp -r .asv/html/* docs/_build/html/benchmarks/
          else
            echo "No benchmark HTML produced — skipping"
          fi
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-docs:
    needs: build-docs
    # impulso guards this job with `github.event_name == 'push' && github.ref ==
    # 'refs/heads/main'`. GPJax also allows workflow_dispatch, so the branch
    # check is kept but the event check is not: a manual run from a feature
    # branch must never publish to the production URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
