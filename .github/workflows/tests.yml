name: Run Tests
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job reads the repository and uploads coverage with a dedicated Codecov
# token; it never needs a GITHUB_TOKEN scope.
permissions: {}

jobs:
  unit-tests:
    name: Run Tests
    timeout-minutes: 30
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      # Install the dependencies
      - name: Check docstrings
        run: |
          uv sync --frozen
          uv run xdoctest ./gpjax

      # Run the unit tests and build the coverage report
      - name: Run Tests
        run: uv run pytest . -v --cov=./gpjax --cov-report=xml:./coverage.xml


      - name: Upload code coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          name: gpjax
          flags: unittests
          env_vars: OS,PYTHON
