[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpjax"
dynamic = ["version"]
description = 'Gaussian processes in JAX.'
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["gaussian-processes jax machine-learning bayesian"]
authors = [{ name = "Thomas Pinder", email = "tompinder@live.co.uk" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "jax>=0.5.0,<0.11",
  "jaxlib>=0.5.0,<0.11",
  "optax>0.2.1",
  "numpyro>=0.19.0",
  "jaxtyping>0.2.10",
  "tqdm>4.66.2",
  "beartype>0.16.1",
  "equinox>=0.11.0",
  "paramax>=0.0.5",
  "lineax>=0.0.6",
  "scipy>=1.14",
  "numpy>=2.0.0",
  "tensorstore!=0.1.76; sys_platform == 'darwin'",
  "rich>=13.0.0",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5.3",
  "mkdocs-material>=9.5.12",
  "mkdocstrings[python]<1.1.0",
  "mkdocs-jupyter>=0.24.3",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-literate-nav>=0.6.0",
  "mkdocs-git-authors-plugin>=0.7.0",
  "matplotlib>=3.7.1",
  "seaborn>=0.12.2",
  "networkx>=3.0",
  "jupytext>=1.14.5",
  "ipython>=8.11.0",
  "ipykernel>=6.22.0",
  "watermark>=2.3.1",
  "blackjax>=0.9.6",
  "ipywidgets>=8.0.5",
  "pandas>=1.5.3",
  "pymdown-extensions>=10.7.1",
  "nbconvert>=7.16.2",
  "markdown-katex>=202406.1035",
  "scikit-learn>=1.5.1",
  "ucimlrepo>=0.0.7",
]

[tool.uv]
exclude-newer = "7 days"
managed = true
dev-dependencies = [
  "asv>=0.6",
  "ruff>=0.6",
  "pre-commit>=3.2.2",
  "interrogate>=1.5.0",
  "codespell>=2.2.4",
  "pytest>=7.2.2",
  "pytest-cov>=4.0.0",
  "pytest-pretty>=1.1.1",
  "pytest-xdist>=3.2.1",
  "coverage>=7.2.2",
  "absolufy-imports>=0.3.1",
  "xdoctest>=1.1.1",
  "mktestdocs>=0.2.1",
  "networkx",
  "jupytext",
  "pytest-beartype",
  "poethepoet>=0.37.0",
  "twine>=6.2.0",
  "hypothesis>=6.148.2",
]


[project.urls]
Documentation = "https://docs.jaxgaussianprocesses.com/"
Issues = "https://github.com/thomaspinder/GPJax/issues"
Source = "https://github.com/thomaspinder/GPJax"

[tool.hatch.version]
path = "gpjax/__init__.py"

[tool.poe.tasks]
# Run Github actions locally
[tool.poe.tasks.local-actions]
cmd = "act -W .github/workflows/tests.yml"
help = "Run Github actions locally"

# Formatting tasks
[tool.poe.tasks.format]
sequence = [
  { cmd = "ruff check --select I --fix ./gpjax ./tests ./benchmarks" },
  { cmd = "ruff format ./gpjax ./tests ./benchmarks" }
]
help = "Format code using ruff"

# Linting tasks
[tool.poe.tasks.lint]
sequence = [
  { cmd = "ruff format --check --diff ./gpjax ./tests ./benchmarks" },
  { cmd = "ruff check --fix ./gpjax ./tests ./benchmarks" }
]
help = "Check code formatting and style"

[tool.poe.tasks.lint-ci]
sequence = [
  { cmd = "ruff format --check --diff ./gpjax ./tests ./benchmarks" },
  { cmd = "ruff check --no-fix ./gpjax ./tests ./benchmarks" }
]
help = "Check code formatting and style without mutating files (used by CI)"

# Testing tasks
[tool.poe.tasks.test]
cmd = "pytest tests -v -n 8 -m 'not slow' --beartype-packages='gpjax'"
help = "Run tests with pytest"

[tool.poe.tasks.test-slow]
cmd = "pytest tests -v -n 8 --beartype-packages='gpjax'"
help = "Run tests including slow tests"

[tool.poe.tasks.coverage]
cmd = "pytest . -v --cov=./gpjax --cov-report=xml:./coverage.xml"
help = "Run tests with coverage reporting"

[tool.poe.tasks.docstrings]
cmd = "xdoctest ./gpjax"
help = "Test docstring examples"

# Documentation tasks
[tool.poe.tasks.docs-build]
sequence = [
  { cmd = "python docs/scripts/gen_examples.py --execute" },
  { cmd = "mkdocs build" }
]
help = "Build documentation"

[tool.poe.tasks.docs-serve]
cmd = "mkdocs serve --dev-addr localhost:8000"
help = "Serve documentation locally"

[tool.poe.tasks.integration]
cmd = "python tests/integration_tests.py"
help = "Run integration tests"

# Benchmark tasks (continuous benchmarking via ASV)
[tool.poe.tasks.bench-check]
help = "Validate benchmark suite structure (does NOT run benchmarks). Requires asv-constraints.txt + benchmarks/ to exist on the commit referenced by asv.conf.json's `branches`."
cmd = "asv check"

[tool.poe.tasks.bench-constraints]
help = "Regenerate asv-constraints.txt from uv.lock so ASV envs install the same versions as .venv."
cmd = "uv export --frozen --no-dev --no-emit-project --no-hashes --no-editable --no-annotate --no-header -o asv-constraints.txt"

[tool.poe.tasks.bench]
help = "Run ASV benchmarks against current HEAD on this machine. Pass an optional range via -- (e.g. uv run poe bench -- v0.10..HEAD)."
shell = "asv run --machine $(hostname -s) HEAD^! ${@}"

[tool.poe.tasks.bench-publish]
help = "Generate the static HTML dashboard locally at .asv/html/."
cmd = "asv publish"

[tool.poe.tasks.bench-push]
help = "Commit and push results in .asv-results worktree (the asv-results branch)."
shell = """
cd .asv-results && \
git add results/ && \
git commit -m \"bench results $(date -u +%Y-%m-%dT%H:%M:%SZ)\" && \
git push
"""

[tool.poe.tasks.bench-all]
help = "Chain: refresh constraints, run benchmarks, generate HTML, push results."
sequence = ["bench-constraints", "bench", "bench-publish", "bench-push"]

[tool.poe.tasks.bench-compare]
help = "Run benchmarks on two refs and print a regression report. Usage: uv run poe bench-compare <baseline-ref> <branch-ref>"
shell = "asv continuous --machine $(hostname -s) -e ${1} ${2}"

# Combined tasks
[tool.poe.tasks.all-tests]
sequence = ["lint", "docstrings", "test"]
help = "Run all checks and tests"

[tool.poe.tasks.all-tests-slow]
sequence = ["lint", "docstrings", "test-slow"]
help = "Run all checks and tests including slow tests"

[tool.coverage.run]
source_pkgs = ["gpjax", "tests"]
branch = true
parallel = true
omit = ["gpjax/__init__.py"]

[tool.coverage.paths]
gpjax = ["gpjax", "*/gpjax/"]
tests = ["tests", "*/gpjax/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
fail_under = 50
precision = 1
show_missing = true
skip_covered = true

[tool.pytest.ini_options] # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "slow: long-running numerical and memory stress tests (opt-in via poe all-tests-slow)",
]

[tool.ruff] # https://github.com/charliermarsh/ruff
fix = true
cache-dir = "~/.cache/ruff"
exclude = ["docs/", "examples/"]
line-length = 88
src = ["gpjax", "tests", "benchmarks"]
target-version = "py311"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # pylint
  "PLE",
  "PLR",
  "PLW",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # pyupgrade
  "UP",
  # flake8-simplify
  "SIM",
  # ruff-specific
  "RUF",
]
ignore = [
  # calls in argument defaults
  "B008",
  # space before : (needed for how black formats slicing)
  # "E203",  # not yet implemented
  # module level import not at top of file
  "E402",
  # do not assign a lambda expression, use a def
  "E731",
  "E501",
  "S303",
  "S307",
  "RET504",
  "S101",
  "F722",
  'PLR2004',
  "PLR0913",
  # too-many-positional-arguments. Kernels, likelihoods and variational
  # families are constructed positionally with defaults (e.g.
  # `RBF(active_dims, lengthscale, variance, n_dims, compute_engine)`);
  # forcing keyword-only arguments would break those public signatures.
  # Paired with PLR0913 above, which ignores the same shape of constructor.
  "PLR0917",
  # intentional math Unicode (σ, ℓ) in docstrings and comments
  "RUF002",
  "RUF003",
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"gpjax/__init__.py" = ['I', 'F401', 'E402', 'D104']
"gpjax/scan.py" = ["PLR0913"]
"gpjax/citation.py" = ["F811"]
"gpjax/gps.py" = ["F811"]
"tests/test_objectives.py" = ["PLR0913"]
"examples/barycentres.py" = ["PLR0913"]
"tests/*.py" = ["PLW0108"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 64
exclude = [
  "setup.py",
  "docs",
  "tests",
  "gpjax/__init__.py",
  "gpjax/citation.py",
]
verbose = 2
quiet = false
color = true
